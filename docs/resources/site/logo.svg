<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3F51B5;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#009688;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#009688;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="90" fill="#f8f9fa" opacity="0.1" />

    <!-- Neural network brain shape -->
    <path d="M60 50 Q40 30, 50 70 Q30 90, 60 100 Q40 120, 70 140 Q90 150, 120 140 Q150 120, 140 100 Q170 90, 150 70 Q160 30, 140 50 Q120 40, 100 45 Q80 40, 60 50 Z"
          fill="url(#brainGradient)" opacity="0.8" filter="url(#glow)" />

    <!-- Circuit board nodes -->
    <circle cx="70" cy="60" r="4" fill="#00BCD4" filter="url(#glow)" />
    <circle cx="100" cy="55" r="4" fill="#00BCD4" filter="url(#glow)" />
    <circle cx="130" cy="60" r="4" fill="#00BCD4" filter="url(#glow)" />
    <circle cx="65" cy="100" r="4" fill="#00BCD4" filter="url(#glow)" />
    <circle cx="100" cy="95" r="4" fill="#00BCD4" filter="url(#glow)" />
    <circle cx="135" cy="100" r="4" fill="#00BCD4" filter="url(#glow)" />
    <circle cx="80" cy="130" r="4" fill="#00BCD4" filter="url(#glow)" />
    <circle cx="120" cy="130" r="4" fill="#00BCD4" filter="url(#glow)" />

    <!-- Neural connections -->
    <path d="M70 60 L100 55 L130 60 M100 55 L100 95 M70 60 L65 100 M130 60 L135 100 M65 100 L80 130 M100 95 L80 130 M100 95 L120 130 M135 100 L120 130"
          stroke="url(#circuitGradient)" stroke-width="2" opacity="0.7" fill="none" />

    <!-- Central processing unit -->
    <rect x="85" y="80" width="30" height="30" rx="4" fill="url(#brainGradient)" opacity="0.9" filter="url(#glow)" />

    <!-- Data streams -->
    <path d="M100 85 L95 90 L105 95 L95 100 L105 105" stroke="#00BCD4" stroke-width="1.5" fill="none" opacity="0.8" />

    <!-- Stylized SM initials in the center -->
    <g transform="translate(100, 160) scale(1.2)">
        <!-- S -->
        <path d="M-10 -15 C-10 -25, -25 -28, -25 -20 C-25 -12, -10 -9, -10 0 C-10 12, -25 15, -25 8"
              fill="none" stroke="url(#brainGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
        <!-- M -->
        <path d="M5 20 L5 -15 M5 -15 L15 5 M15 5 L25 -15 M25 -15 L25 20"
              fill="none" stroke="url(#brainGradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
    </g>

    <!-- Tech accent lines -->
    <path d="M30 30 L50 30" stroke="url(#circuitGradient)" stroke-width="2" opacity="0.5" />
    <path d="M150 30 L170 30" stroke="url(#circuitGradient)" stroke-width="2" opacity="0.5" />
    <path d="M30 170 L50 170" stroke="url(#circuitGradient)" stroke-width="2" opacity="0.5" />
    <path d="M150 170 L170 170" stroke="url(#circuitGradient)" stroke-width="2" opacity="0.5" />
</svg>